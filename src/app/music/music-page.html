<main class="hero">
  <app-hero-scene [scene]="sceneId()" [animate]="player.isPlaying()" />

  <app-live-clock />

  <a
    class="yt-badge"
    [href]="player.activePlaylist().youTubeUrl"
    target="_blank"
    rel="noopener noreferrer"
    title="Open this playlist in YouTube Music"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
      <path
        d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 16.5a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13zM9.75 8.5l6 3.5-6 3.5v-7z"
      />
    </svg>
    <span>YouTube Music</span>
    <svg
      class="arrow"
      viewBox="0 0 24 24"
      width="12"
      height="12"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <line x1="7" y1="17" x2="17" y2="7" />
      <polyline points="7 7 17 7 17 17" />
    </svg>
  </a>

  @if (showStartPrompt()) {
    <button type="button" class="start-prompt" (click)="start()">
      <span class="ring">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
      </span>
      <span>Tap to start the journey</span>
    </button>
  }

  <app-player-bar />

  <p class="visually-hidden" aria-live="polite">
    {{ player.track().title }} by {{ player.track().artist }} —
    {{ player.isPlaying() ? 'playing' : 'paused' }}
  </p>
</main>
