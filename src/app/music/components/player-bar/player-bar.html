<div class="wrapper">
  <app-playlist-menu [open]="menuOpen()" (dismiss)="closeMenu()" />

  <section class="player" aria-label="Audio player">
    <div class="main-row">
      <!-- Generated artwork: a vinyl that spins while the track plays -->
      <div class="artwork" [class.spinning]="player.isPlaying()">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="art-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f0be75" />
              <stop offset="100%" stop-color="#b3452c" />
            </linearGradient>
          </defs>
          <rect width="100" height="100" fill="#241d2d" />
          <circle cx="50" cy="50" r="34" fill="url(#art-grad)" />
          <circle
            cx="50"
            cy="50"
            r="34"
            fill="none"
            stroke="#0d0a12"
            stroke-opacity="0.25"
            stroke-width="1"
          />
          <circle
            cx="50"
            cy="50"
            r="24"
            fill="none"
            stroke="#0d0a12"
            stroke-opacity="0.28"
            stroke-width="1.5"
          />
          <circle
            cx="50"
            cy="50"
            r="15"
            fill="none"
            stroke="#0d0a12"
            stroke-opacity="0.28"
            stroke-width="1.5"
          />
          <circle cx="50" cy="50" r="6" fill="#0d0a12" />
        </svg>
        @if (player.isPlaying()) {
          <span class="equaliser" aria-hidden="true"><i></i><i></i><i></i></span>
        }
      </div>

      <div class="details">
        <p class="title" [title]="player.track().title">{{ player.track().title }}</p>
        <p class="artist">
          @if (player.errorMessage()) {
            {{ player.errorMessage() }}
          } @else if (player.isBuffering()) {
            Buffering…
          } @else {
            {{ player.track().artist }}
          }
        </p>
      </div>

      <div class="controls">
        <button type="button" class="ctrl" (click)="player.previous()" aria-label="Previous track">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
          </svg>
        </button>

        <button
          type="button"
          class="ctrl play"
          (click)="player.toggle()"
          [attr.aria-label]="player.isPlaying() ? 'Pause' : 'Play'"
        >
          @if (player.isPlaying()) {
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
          }
        </button>

        <button type="button" class="ctrl" (click)="player.next(true)" aria-label="Next track">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
          </svg>
        </button>

        <button
          type="button"
          class="ctrl menu-btn"
          [class.active]="menuOpen()"
          (click)="toggleMenu()"
          aria-label="Playlists and queue"
          aria-haspopup="true"
          [attr.aria-expanded]="menuOpen()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>
      </div>
    </div>

    <div class="progress-section">
      <div
        class="track"
        role="slider"
        tabindex="0"
        aria-label="Seek"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="shownPercentRounded()"
        [attr.aria-valuetext]="shownTimeLabel() + ' of ' + player.durationLabel()"
        (pointerdown)="onScrubStart($event)"
        (pointermove)="onScrubMove($event)"
        (pointerup)="onScrubEnd($event)"
        (pointercancel)="onScrubEnd($event)"
        (keydown)="onScrubKeydown($event)"
      >
        <div class="rail"></div>
        <div class="fill" [style.width.%]="shownPercent()"></div>
        <div class="thumb" [style.left.%]="shownPercent()"></div>
      </div>
      <div class="times">
        <span>{{ shownTimeLabel() }}</span>
        <span>{{ player.durationLabel() }}</span>
      </div>
    </div>
  </section>
</div>
