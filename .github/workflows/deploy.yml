name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Requires Settings -> Pages -> Source: "GitHub Actions" to be set once.
      # The default token can't enable Pages itself, so this reads the config
      # rather than trying to create it.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Served from a repo subpath, so the base href must match it or every
          # asset and route resolves against the domain root instead.
          base="${BASE_PATH:-/songs-playlist}"
          npx ng build --base-href "${base%/}/"

      - name: Add SPA fallback and disable Jekyll
        run: |
          cd dist/safar/browser
          # Pages has no rewrite rules, so a refresh on /music would 404.
          # Serving index.html as 404.html lets the Angular router take over.
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/safar/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
